name: Wails build

on:
  push:
    tags:
    # Match any new tag
      - '*-release'
      - '*-dev'
      - '*-pre'
  # 支持在 Actions 页面手动触发打包（默认按当前分支构建，不上传 Release）
  workflow_dispatch:

# 同一分支/标签重复触发时只保留最新一次，省排队与构建资源
concurrency:
  group: wails-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"
  OFFICIAL_STATEMENT: ${{ vars.OFFICIAL_STATEMENT }}
  BUILD_KEY: ${{ vars.BUILD_KEY }}

permissions:
  contents: write

jobs:
  build:
    strategy:
    # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        build:
          - name: 'go-stock-windows-amd64.exe'
            platform:  'windows/amd64'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- 构建缓存（Go 模块/编译缓存 + 前端依赖缓存）----
      # wails-build-action 内部自装 Go/Node，这里只负责 restore/save 缓存路径，
      # 命中后 Go 拉模块与 npm install 明显提速。
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~\AppData\Local\go-build
          key: go-${{ matrix.build.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ matrix.build.os }}-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~\.npm
          key: npm-${{ matrix.build.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ matrix.build.os }}-

      - name: Get commit message
        id: get_commit_message
        run: |
          echo "commit_message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-release ]]; then
            echo "channel=release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel_label=Release（稳定版）" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-pre ]]; then
            echo "channel=pre" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel_label=Pre-release（预发布版）" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-dev ]]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel_label=Dev（开发版）" >> $GITHUB_OUTPUT
          fi

      - name: Build wails x go-stock
        uses: ArvinLovegood/wails-build-action@v3.8
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          # 仅 tag 推送时打包发 Release；手动触发只构建出 Artifact
          package: ${{ startsWith(github.ref, 'refs/tags/') }}
          go-version: '1.26'
          build-tags: ${{ github.ref_name }}
          build-commit-message: ${{ steps.get_commit_message.outputs.commit_message }}
          build-statement: ${{ env.OFFICIAL_STATEMENT }}
          build-key: ${{ env.BUILD_KEY }}
          node-version: '22.22.2'
          wails-version: 'v2.11.0'
          nsis: ${{ startsWith(github.ref, 'refs/tags/') }}

      # 手动触发：上传裸构建产物，方便取包验证
      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: go-stock-windows-amd64
          path: ${{ steps.build.outputs.artifact-path || 'build/bin/*' }}
          if-no-files-found: warn

      - name: Update release for channel
        if: steps.channel.outputs.channel != '' && steps.channel.outputs.channel != 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = '${{ github.ref_name }}';
            const channel = '${{ steps.channel.outputs.channel }}';
            const channelLabel = '${{ steps.channel.outputs.channel_label }}';
            const prerelease = '${{ steps.channel.outputs.prerelease }}' === 'true';

            const { data: releases } = await github.rest.repos.listReleases({ owner, repo });
            const release = releases.find(r => r.tag_name === tag);

            if (release) {
              const updateParams = {
                owner,
                repo,
                release_id: release.id,
                prerelease: prerelease,
                make_latest: 'false'
              };

              let channelNotice = '';
              if (channel === 'dev') {
                channelNotice = '\n\n---\n> ⚠️ **' + channelLabel + '** - 此版本为开发版，可能存在不稳定功能，仅供测试使用。';
              } else if (channel === 'pre') {
                channelNotice = '\n\n---\n> 🔄 **' + channelLabel + '** - 此版本为预发布版，欢迎体验新功能并反馈问题。';
              }
              if (channelNotice) {
                updateParams.body = (release.body || '') + channelNotice;
              }

              await github.rest.repos.updateRelease(updateParams);
              core.info(`Updated release ${tag}: prerelease=${prerelease}, channel=${channel}`);
            } else {
              core.warning(`Release not found for tag ${tag}`);
            }
