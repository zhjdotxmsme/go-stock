name: Android APK

# go-stock Android 移动端(mobile/ 目录, Wails v3)云端打包:
# 手动触发,产出 release APK(无正式签名时用 debug keystore 签名,可直接安装)。
# 架构说明: arm64=绝大多数真机; amd64=Android 模拟器; fat=arm64+x86_64 通用包。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - amd64
          - fat

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  WAILS_VERSION: 'v3.0.0-beta.20'
  NDK_VERSION: '26.3.11579264'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Android Gradle 需要 17+,统一用 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            mobile/go.sum

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK (sdkmanager 就绪,ANDROID_HOME 已设置)
        uses: android-actions/setup-android@v3

      - name: Install NDK & SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build APK (arch=${{ inputs.arch }})
        working-directory: mobile
        run: |
          if [ "${{ inputs.arch }}" = "fat" ]; then
            wails3 task android:package:fat
          else
            wails3 task android:package ARCH=${{ inputs.arch }}
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-stock-android-${{ inputs.arch }}
          path: mobile/bin/*.apk
          if-no-files-found: error
