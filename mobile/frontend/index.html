<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>go-stock</title>
    <!-- Android WebView bootstrap: 必须在 module script 之前挂 window._wails.invoke -->
    <script>
        if (window.wails && window.wails.invoke) {
            window._wails = window._wails || {};
            window._wails.invoke = function (m) {
                return window.wails.invoke(typeof m === 'string' ? m : JSON.stringify(m));
            };
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #121212; --panel: #1e1e1e; --line: #2c2c2c;
            --fg: #eaeaea; --fg-dim: #9a9a9a; --accent: #4a90e2;
            --red: #e05656; --green: #21b978;
        }
        html, body { height: 100%; background: var(--bg); color: var(--fg);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; }
        header { padding: 12px 16px 8px; font-size: 17px; font-weight: 600; }
        .tabs { display: flex; border-bottom: 1px solid var(--line); }
        .tabs button { flex: 1; padding: 10px 0; background: none; border: none;
            color: var(--fg-dim); font-size: 15px; }
        .tabs button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        main { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
        .page { display: none; }
        .page.active { display: block; }
        .row { display: flex; gap: 8px; margin-bottom: 12px; }
        input, textarea, select { background: var(--panel); border: 1px solid var(--line);
            color: var(--fg); border-radius: 8px; padding: 10px; font-size: 15px; width: 100%; }
        textarea { min-height: 72px; resize: vertical; }
        button.btn { background: var(--accent); color: #fff; border: none; border-radius: 8px;
            padding: 10px 16px; font-size: 15px; }
        button.btn.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
        #kline-chart { width: 100%; height: 320px; background: var(--panel); border-radius: 8px; }
        .quote-head { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
        .quote-name { font-size: 17px; font-weight: 600; }
        .quote-change { font-size: 14px; font-weight: 600; }
        .up { color: var(--red); } .down { color: var(--green); }
        .stock-item { padding: 12px; border-bottom: 1px solid var(--line); display: flex;
            justify-content: space-between; align-items: center; cursor: pointer; }
        .stock-item:active { background: var(--panel); }
        .stock-item .s-name { font-size: 15px; }
        .stock-item .s-code { color: var(--fg-dim); font-size: 12px; margin-top: 2px; }
        .stock-item .s-price { text-align: right; }
        .chat-msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px;
            background: var(--panel); font-size: 14px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word; }
        .chat-msg.user { background: #23405e; }
        .chat-msg .reasoning { color: var(--fg-dim); font-size: 12px; margin-bottom: 6px; }
        .empty { color: var(--fg-dim); text-align: center; padding: 40px 0; font-size: 14px; }
        .status-line { color: var(--fg-dim); font-size: 12px; margin: 6px 2px; min-height: 16px; }
        nav.tabbar { display: flex; border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom); }
        nav.tabbar button { flex: 1; padding: 12px 0; background: none; border: none;
            color: var(--fg-dim); font-size: 14px; }
        nav.tabbar button.active { color: var(--accent); }
    </style>
</head>
<body>
    <header id="page-title">行情</header>
    <main>
        <!-- 行情页 -->
        <section class="page active" id="page-market">
            <div class="row">
                <input id="stock-code" placeholder="股票代码,如 600262 / 00700 / gb_aapl" autocapitalize="off"/>
                <button class="btn" id="btn-load-kline">查询</button>
            </div>
            <div class="quote-head">
                <span class="quote-name" id="quote-name">--</span>
                <span class="quote-change" id="quote-change"></span>
            </div>
            <div id="kline-chart"></div>
            <div class="status-line" id="market-status"></div>
            <h3 style="font-size:14px;color:var(--fg-dim);margin:14px 2px 4px;">自选列表</h3>
            <div id="follow-list"><div class="empty">加载中...</div></div>
        </section>

        <!-- AI 问答页 -->
        <section class="page" id="page-ai">
            <div class="row">
                <select id="ai-config"></select>
            </div>
            <div class="row">
                <textarea id="ai-question" placeholder="向 AI 提问,如:分析一下今天的行情"></textarea>
            </div>
            <div class="row">
                <button class="btn" id="btn-ask">提问</button>
                <button class="btn secondary" id="btn-abort">中断</button>
            </div>
            <div class="status-line" id="ai-status"></div>
            <div id="chat-box"><div class="empty">回答将在这里流式输出</div></div>
        </section>
    </main>
    <nav class="tabbar">
        <button class="active" data-page="market">行情</button>
        <button data-page="ai">AI 问答</button>
    </nav>
    <script type="module" src="/main.js"></script>
</body>
</html>
