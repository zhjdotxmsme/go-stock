<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>go-stock</title>
    <script>
        if (window.wails && window.wails.invoke) {
            window._wails = window._wails || {};
            window._wails.invoke = function (m) {
                return window.wails.invoke(typeof m === 'string' ? m : JSON.stringify(m));
            };
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:#0f1420; --panel:#1a2130; --panel-2:#232c3f; --line:#2b374d;
            --fg:#e6ecf5; --fg-dim:#8a95ab; --accent:#4a90e2;
            --red:#ff5a6a; --green:#21b978; --warn:#e0a23a;
        }
        html, body { height:100%; background:var(--bg); color:var(--fg);
            font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
            -webkit-tap-highlight-color:transparent; }
        body { display:flex; flex-direction:column; }
        header { padding:14px 16px 8px; font-size:17px; font-weight:600;
            display:flex; align-items:center; gap:10px; }
        header .sub { font-size:12px; color:var(--fg-dim); font-weight:400; }
        main { flex:1; overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch;
            overscroll-behavior:contain; }
        .page { display:none; }
        .page.active { display:block; }
        .card { background:var(--panel); border:1px solid var(--line);
            border-radius:12px; padding:12px 14px; margin-bottom:12px; }
        .card h3 { font-size:14px; color:var(--fg-dim); font-weight:500; margin-bottom:10px; }
        .row { display:flex; gap:8px; }
        .row.wrap { flex-wrap:wrap; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        input, textarea, select { background:var(--panel-2); border:1px solid var(--line);
            color:var(--fg); border-radius:8px; padding:10px 12px; font-size:15px; width:100%;
            height:auto; line-height:1.4; }
        textarea { min-height:72px; resize:vertical; }
        button.btn { background:var(--accent); color:#fff; border:none; border-radius:8px;
            padding:10px 16px; font-size:15px; font-weight:500; flex-shrink:0; }
        button.btn.ghost { background:var(--panel-2); color:var(--fg); border:1px solid var(--line); }
        button.btn:disabled { opacity:.5; }
        .up { color:var(--red); } .down { color:var(--green); }
        .neutral { color:var(--fg); }
        #kline-chart, #commodity-chart { width:100%; height:300px; background:var(--panel);
            border-radius:10px; border:1px solid var(--line); }
        .quote-head { display:flex; justify-content:space-between; align-items:baseline; margin:2px 2px 10px; }
        .quote-name { font-size:16px; font-weight:600; }
        .quote-change { font-size:20px; font-weight:700; }
        .stock-row { padding:12px 0; border-bottom:1px solid var(--line); display:flex;
            justify-content:space-between; align-items:center; cursor:pointer; }
        .stock-row:last-child { border-bottom:none; }
        .s-name { font-size:15px; }
        .s-code { color:var(--fg-dim); font-size:12px; margin-top:3px; }
        .s-price { text-align:right; }
        .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px;
            background:var(--panel-2); border:1px solid var(--line); color:var(--fg-dim);
            margin-right:6px; margin-top:6px; }
        .empty { color:var(--fg-dim); text-align:center; padding:32px 0; font-size:14px; }
        .status-line { color:var(--fg-dim); font-size:12px; margin:8px 2px; min-height:18px; }
        .status-line.err { color:var(--red); }
        .chat-msg { margin:10px 0; padding:12px 14px; border-radius:12px;
            background:var(--panel); font-size:14px; line-height:1.6;
            white-space:pre-wrap; word-break:break-word; }
        .chat-msg.user { background:#2a3d5a; }
        .chat-msg .reasoning { color:var(--fg-dim); font-size:12px; margin-bottom:8px;
            border-left:2px solid var(--line); padding-left:8px; }
        .kv { display:flex; justify-content:space-between; padding:6px 0; font-size:14px;
            border-bottom:1px dashed var(--line); }
        .kv:last-child { border-bottom:none; }
        .kv .k { color:var(--fg-dim); }
        .progress { height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
        .progress > div { height:100%; background:var(--accent); transition:width .3s; }
        nav.tabbar { display:flex; border-top:1px solid var(--line); background:var(--panel);
            padding-bottom:env(safe-area-inset-bottom); }
        nav.tabbar button { flex:1; padding:12px 0 10px; background:none; border:none;
            color:var(--fg-dim); font-size:12px; display:flex; flex-direction:column; align-items:center;
            gap:4px; }
        nav.tabbar button.active { color:var(--accent); font-weight:600; }
        nav.tabbar button .ico { font-size:20px; line-height:1; }
        .chip-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
        .chip { padding:6px 12px; border-radius:16px; background:var(--panel-2);
            color:var(--fg); font-size:13px; border:1px solid var(--line); flex-shrink:0;
            white-space:nowrap; }
        .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .stat-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
        .stat-strip .s { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:8px 6px; text-align:center; }
        .stat-strip .s .num { font-size:16px; font-weight:600; }
        .stat-strip .s .lab { font-size:10px; color:var(--fg-dim); margin-top:2px; }
        pre.code { background:var(--panel-2); color:var(--fg); padding:10px; border-radius:8px;
            font-size:11px; overflow-x:auto; white-space:pre-wrap; word-break:break-all;
            border:1px solid var(--line); max-height:260px; overflow-y:auto; }
    </style>
</head>
<body>
    <header>
        <span id="page-title">行情</span>
        <span class="sub" id="page-sub"></span>
    </header>
    <main>
        <!-- 页1: 行情（自选 + K线 + 大盘 + 商品） -->
        <section class="page active" id="page-market">
            <div class="row stat-strip" id="mkt-stat-strip">
                <div class="s"><div class="num neutral" id="mkt-up">--</div><div class="lab">上涨</div></div>
                <div class="s"><div class="num neutral" id="mkt-down">--</div><div class="lab">下跌</div></div>
                <div class="s"><div class="num neutral" id="mkt-limitup">--</div><div class="lab">涨停</div></div>
                <div class="s"><div class="num neutral" id="mkt-limitdown">--</div><div class="lab">跌停</div></div>
            </div>

            <div class="card">
                <h3>个股查询（K线 / 分时）</h3>
                <div class="row">
                    <input id="stock-code" placeholder="股票代码 600262 / 00700 / gbj_600519" autocapitalize="off" style="flex:1"/>
                    <button class="btn" id="btn-load-kline">查询</button>
                </div>
                <div class="chip-row" style="margin-top:10px" id="kline-period">
                    <button class="chip active" data-klt="101">日K</button>
                    <button class="chip" data-klt="60">60分</button>
                    <button class="chip" data-klt="30">30分</button>
                    <button class="chip" data-klt="15">15分</button>
                </div>
                <div class="quote-head" style="margin-top:12px;">
                    <span class="quote-name" id="quote-name">--</span>
                    <span class="quote-change" id="quote-change"></span>
                </div>
                <div id="kline-chart"></div>
                <div class="status-line" id="market-status"></div>
            </div>

            <div class="card">
                <h3>自选股（点击加载K线）</h3>
                <div id="follow-list" class="card" style="border-radius:0;padding:0;border:none;background:transparent;margin-top:0;">
                    <div class="empty">加载中...</div>
                </div>
                <div class="row" style="margin-top:8px">
                    <button class="btn ghost" id="btn-refresh-fl" style="flex:1">刷新</button>
                    <button class="btn ghost" id="btn-add-follow" style="flex:1">关注当前</button>
                    <button class="btn ghost" id="btn-unfollow" style="flex:1; color:var(--red)">取关当前</button>
                </div>
            </div>

            <div class="card">
                <h3>全球指数 & 大盘</h3>
                <div id="global-idx" class="empty">加载中...</div>
                <div class="row" style="margin-top:8px">
                    <button class="btn ghost" id="btn-refresh-idx" style="flex:1">刷新</button>
                </div>
            </div>

            <div class="card">
                <h3>大宗商品</h3>
                <div class="row">
                    <input id="cmd-code" placeholder="商品代码 AU0 / SI0 / SC0" style="flex:1" autocapitalize="off"/>
                    <select id="cmd-period">
                        <option value="day">日</option>
                        <option value="week">周</option>
                        <option value="month">月</option>
                    </select>
                    <button class="btn" id="btn-cmd">查询</button>
                </div>
                <div id="cmd-quote" class="status-line"></div>
                <div id="commodity-chart"></div>
            </div>

            <div class="card">
                <h3>实时公告 / 快讯</h3>
                <div class="row">
                    <select id="news-src" style="flex:1">
                        <option value="telegraph">电报</option>
                        <option value="cls">财联社</option>
                        <option value="sina">新浪</option>
                    </select>
                    <button class="btn" id="btn-news">刷新</button>
                </div>
                <div id="news-list" style="margin-top:10px;max-height:280px;overflow-y:auto"></div>
            </div>
        </section>

        <!-- 页2: AI（agent + 个股分析师 + 商品分析师） -->
        <section class="page" id="page-ai">
            <div class="card">
                <h3>AI 配置</h3>
                <div class="row">
                    <select id="ai-config" style="flex:1"></select>
                    <button class="btn ghost" id="btn-ai-refresh">刷新</button>
                </div>
                <div class="chip-row" style="margin-top:10px" id="ai-mode">
                    <button class="chip active" data-mode="quick">快问</button>
                    <button class="chip" data-mode="pro">深度</button>
                </div>
            </div>

            <div class="card">
                <h3>对话式（Agent）</h3>
                <div class="row">
                    <textarea id="ai-question" placeholder="向 AI 提问。例如: 分析今天的盘面，帮我看看 300750" style="flex:1"></textarea>
                </div>
                <div class="row" style="margin-top:8px">
                    <button class="btn" id="btn-ask" style="flex:1">发送</button>
                    <button class="btn ghost" id="btn-abort" style="flex:1">中断</button>
                </div>
                <div class="status-line" id="ai-status"></div>
            </div>

            <div class="card">
                <h3>个股 · 流式分析</h3>
                <div class="row">
                    <input id="an-stock" placeholder="股票代码 600262" style="flex:1" autocapitalize="off"/>
                    <input id="an-q" placeholder="可选：额外问题" style="flex:1"/>
                </div>
                <div class="row" style="margin-top:8px">
                    <button class="btn" id="btn-analyze" style="flex:1">开始分析</button>
                    <button class="btn ghost" id="btn-analyze-abort" style="flex:1">中断</button>
                </div>
                <div class="status-line" id="an-status"></div>
            </div>

            <div id="chat-box"></div>
        </section>

        <!-- 页3: 选股（每日选股 + 复盘 + 回测） -->
        <section class="page" id="page-pick">
            <div class="card">
                <h3>今日候选池</h3>
                <div class="stat-strip" style="margin-bottom:8px">
                    <div class="s"><div class="num" id="pk-count">--</div><div class="lab">池数</div></div>
                    <div class="s"><div class="num" id="pk-avg-score">--</div><div class="lab">平均分</div></div>
                    <div class="s"><div class="num" id="pk-hit">--</div><div class="lab">复盘胜率</div></div>
                    <div class="s"><div class="num" id="pk-date">--</div><div class="lab">日期</div></div>
                </div>
                <div class="row">
                    <input type="date" id="pk-date-input" style="flex:1"/>
                    <select id="pk-topn" style="max-width:100px"><option value="10">Top10</option><option value="20">Top20</option><option value="50">Top50</option></select>
                </div>
                <div class="row" style="margin-top:8px">
                    <button class="btn" id="btn-pk-run" style="flex:1">立即跑一次选股</button>
                    <button class="btn ghost" id="btn-pk-refresh" style="flex:1">刷新</button>
                </div>
                <div class="status-line" id="pk-status"></div>
                <div id="pk-list" style="margin-top:8px"></div>
            </div>

            <div class="card">
                <h3>复盘 & 回测</h3>
                <div class="row">
                    <button class="btn ghost" id="btn-review-all" style="flex:1">全部复盘未复盘</button>
                </div>
                <div class="row" style="margin-top:8px">
                    <button class="btn ghost" id="btn-bt-run" style="flex:1">对 Top 池跑一次回测</button>
                    <button class="btn ghost" id="btn-bt-view" style="flex:1">看最近结果</button>
                </div>
                <div class="status-line" id="bt-status"></div>
            </div>

            <div class="card" id="bt-result-card" style="display:none">
                <h3>回测结果</h3>
                <div id="bt-result" class="pre code"></div>
            </div>
        </section>

        <!-- 页4: 持仓（交易记录 + 组合 + 基金 + 异动） -->
        <section class="page" id="page-pos">
            <div class="card">
                <h3>持仓概览</h3>
                <div id="pos-holdings" class="empty">加载中...</div>
                <div class="row" style="margin-top:10px">
                    <button class="btn ghost" id="btn-pos-refresh" style="flex:1">刷新</button>
                    <button class="btn ghost" id="btn-pos-sum" style="flex:1">AI 摘要</button>
                </div>
            </div>

            <div class="card">
                <h3>交易记录（近 10 条）</h3>
                <div id="pos-records" class="empty">加载中...</div>
                <div class="row" style="margin-top:8px">
                    <input id="nr-code" placeholder="代码" style="flex:1" autocapitalize="off"/>
                    <input id="nr-price" type="number" placeholder="价格" style="max-width:90px"/>
                    <select id="nr-side" style="max-width:80px">
                        <option value="buy">买</option><option value="sell">卖</option>
                    </select>
                    <button class="btn" id="btn-nr-add">记录</button>
                </div>
                <div class="status-line" id="nr-status"></div>
            </div>

            <div class="card">
                <h3>基金</h3>
                <div id="pos-funds" class="empty">加载中...</div>
                <div class="row" style="margin-top:8px">
                    <input id="fd-code" placeholder="基金代码" style="flex:1" autocapitalize="off"/>
                    <button class="btn" id="btn-fd-follow">加入自选</button>
                    <button class="btn ghost" id="btn-fd-unfollow">取关</button>
                </div>
                <div class="status-line" id="fd-status"></div>
            </div>

            <div class="card">
                <h3>异动 & 涨跌</h3>
                <div id="pos-changes" class="empty">加载中...</div>
                <div class="row" style="margin-top:8px">
                    <button class="btn ghost" id="btn-ch-refresh" style="flex:1">刷新</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="tabbar">
        <button class="active" data-page="market" data-title="行情"><span class="ico">📈</span>行情</button>
        <button data-page="ai" data-title="AI"><span class="ico">🤖</span>AI</button>
        <button data-page="pick" data-title="选股"><span class="ico">🎯</span>选股</button>
        <button data-page="pos" data-title="持仓"><span class="ico">💼</span>持仓</button>
    </nav>
    <script type="module" src="/main.js"></script>
</body>
</html>
